<button mat-icon-button [matMenuTriggerFor]="notificationMenu" class="notification-btn">
  @if (unreadCount() > 0) {
    <mat-icon [matBadge]="unreadCount()" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
  } @else {
    <mat-icon>notifications_none</mat-icon>
  }
</button>

<mat-menu #notificationMenu="matMenu" class="notification-menu">
  <div class="notification-header" (click)="$event.stopPropagation()">
    <span class="notification-title">Notifications</span>
    @if (unreadCount() > 0) {
      <button mat-button color="primary" (click)="markAllAsRead()">Mark all read</button>
    }
  </div>

  <mat-divider></mat-divider>

  <div class="notification-list custom-scrollbar">
    @if (notifications().length === 0) {
      <div class="empty-notifications">
        <mat-icon>notifications_off</mat-icon>
        <span>No notifications</span>
      </div>
    }

    @for (notification of notifications(); track notification.id) {
      <div 
        class="notification-item" 
        [class.unread]="!notification.isRead"
        (click)="markAsRead(notification)">
        <div class="notification-icon" [attr.data-type]="notification.type">
          <mat-icon>{{ getIcon(notification.type) }}</mat-icon>
        </div>
        <div class="notification-content">
          <span class="notification-message">{{ notification.message }}</span>
          <span class="notification-time">{{ getTimeAgo(notification.createdAt) }}</span>
        </div>
        <button mat-icon-button class="delete-btn" (click)="deleteNotification(notification, $event)">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    }
  </div>
</mat-menu>
