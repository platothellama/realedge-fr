<mat-toolbar class="header-toolbar">
  <span class="spacer"></span>
  
  <app-notifications></app-notifications>

  <button mat-button (click)="toggleProfileMenu()" class="profile-btn">
    <img [src]="user()?.photo || 'https://ui-avatars.com/api/?name=' + user()?.name + '&background=6366f1&color=fff'" 
         style="width: 32px; height: 32px; border-radius: 8px; margin-right: 8px;" alt="Avatar">
    <span class="username">{{ user()?.name }}</span>
    <mat-icon iconPositionEnd>{{ showProfileMenu ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}</mat-icon>
  </button>

  @if (showProfileMenu) {
    <div class="profile-dropdown" (click)="$event.stopPropagation()">
      <div class="dropdown-header">
        <img [src]="user()?.photo || 'https://ui-avatars.com/api/?name=' + user()?.name + '&background=6366f1&color=fff'" 
             style="width: 48px; height: 48px; border-radius: 12px;" alt="Avatar">
        <div class="user-info">
          <strong>{{ user()?.name }}</strong>
          <span>{{ user()?.email }}</span>
        </div>
      </div>
      <div class="dropdown-divider"></div>
      <button class="dropdown-item" (click)="showProfile()">
        <mat-icon>person</mat-icon>
        <span>My Profile</span>
      </button>
      <button class="dropdown-item" (click)="showSettings()">
        <mat-icon>settings</mat-icon>
        <span>Account Settings</span>
      </button>
      <div class="dropdown-divider"></div>
      <button class="dropdown-item logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </div>
  }
  
  @if (showProfileMenu) {
    <div class="dropdown-backdrop" (click)="closeProfileMenu()"></div>
  }
</mat-toolbar>
