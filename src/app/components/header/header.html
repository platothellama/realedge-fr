<mat-toolbar class="header-toolbar">
  <span class="spacer"></span>

  <app-notifications></app-notifications>

  <button mat-button
          [matMenuTriggerFor]="profileMenu"
          class="profile-btn"
          aria-label="Account menu">
    <img [src]="user()?.photo || 'https://ui-avatars.com/api/?name=' + user()?.name + '&background=6366f1&color=fff'"
         class="profile-avatar" [alt]="user()?.name + ' profile photo'">
    <span class="username">{{ user()?.name }}</span>
    <mat-icon iconPositionEnd aria-hidden="true">keyboard_arrow_down</mat-icon>
  </button>

  <mat-menu #profileMenu="matMenu" class="profile-menu" xPosition="before">
    <div class="dropdown-header" mat-menu-item disabled>
      <img [src]="user()?.photo || 'https://ui-avatars.com/api/?name=' + user()?.name + '&background=6366f1&color=fff'"
           class="dropdown-avatar" [alt]="user()?.name + ' profile photo'">
      <div class="user-info">
        <strong>{{ user()?.name }}</strong>
        <span>{{ user()?.email }}</span>
        @if (user()?.role) {
          <span class="role-line">{{ user()?.role }}</span>
        }
      </div>
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="logout()" class="logout-item">
      <mat-icon aria-hidden="true">logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
