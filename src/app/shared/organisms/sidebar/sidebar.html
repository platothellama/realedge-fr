<div class="sidebar-header">
  <mat-icon class="logo-icon" aria-hidden="true">domain</mat-icon>
  <span class="logo-text">RealEdge ERP</span>
</div>

<div class="user-profile" *ngIf="user()">
  <img [src]="user()?.photo || 'https://ui-avatars.com/api/?name=' + user()?.name" class="avatar" [alt]="user()?.name + ' profile photo'">
  <div class="user-info">
    <span class="name">{{ user()?.name }}</span>
    <span class="role-badge">{{ user()?.role }}</span>
  </div>
</div>

<mat-nav-list aria-label="Primary navigation">
  @for (item of menuItems(); track item.label) {
    <a mat-list-item
       [routerLink]="item.link"
       routerLinkActive="active-link"
       [routerLinkActiveOptions]="{ exact: false }"
       [matTooltip]="item.label"
       matTooltipPosition="right"
       [attr.aria-label]="item.label">
      <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
      <span matListItemTitle>{{ item.label }}</span>
    </a>
  }
</mat-nav-list>

<div class="sidebar-footer">
  <button mat-stroked-button class="logout-btn" (click)="logout()" aria-label="Sign out" matTooltip="Sign out" matTooltipPosition="right">
    <mat-icon aria-hidden="true">logout</mat-icon>
    <span class="logout-text">Sign Out</span>
  </button>
</div>
