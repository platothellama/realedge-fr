<div class="visits-container">
  <app-page-header title="Visit Calendar" subtitle="Manage property viewings and client meetings">
    <div class="action-area">
      <button mat-raised-button color="primary" class="schedule-btn" (click)="openVisitForm()">
        <mat-icon>add_task</mat-icon>
        Schedule Visit
      </button>
    </div>
  </app-page-header>

  <mat-card class="calendar-card">
    @if (isLoading()) {
      <app-loading-state message="Loading visits..."></app-loading-state>
    } @else {
      <full-calendar [options]="calendarOptions()"></full-calendar>
    }
  </mat-card>
</div>
