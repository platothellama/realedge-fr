<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <div class="login-header">
        <mat-icon class="logo-icon">domain</mat-icon>
        <h1>RealEdge ERP</h1>
        <p>Expert Real Estate Management</p>
      </div>
    </mat-card-header>
    <mat-card-content>
      <form (submit)="onLogin()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email Address</mat-label>
          <input matInput type="email" [(ngModel)]="email" name="email" required placeholder="name@company.com">
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" [(ngModel)]="password" name="password" required>
          <mat-icon matPrefix>lock</mat-icon>
        </mat-form-field>

        <div class="actions">
          <button mat-raised-button color="primary" class="login-btn" type="submit">
            Sign In
          </button>
        </div>
      </form>
    </mat-card-content>
    <mat-card-footer>
      <div class="footer-links">
        <a href="#">Forgot Password?</a>
        <a href="#">Contact Support</a>
      </div>
    </mat-card-footer>
  </mat-card>
</div>
