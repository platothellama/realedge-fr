<div class="ai-container">
  <div class="header-section">
    <h1>AI Broker Assistant</h1>
    <p>Powered by OpenAI. Ask about market trends, lead scoring, or property descriptions.</p>
  </div>

  <div class="chat-wrapper">
    <div class="chat-messages" #scrollContainer>
      @for (msg of messages; track msg.text) {
        <div class="message-row" [class.user-row]="msg.sender === 'user'">
          <div class="avatar" [class.ai-avatar]="msg.sender === 'ai'">
            <mat-icon>{{ msg.sender === 'ai' ? 'smart_toy' : 'person' }}</mat-icon>
          </div>
          <div class="message-bubble">
            <div class="message-text">{{ msg.text }}</div>
            <div class="message-time">{{ msg.time }}</div>
          </div>
        </div>
      }
    </div>

    <div class="chat-input-area">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Type your question...</mat-label>
        <input matInput [(ngModel)]="userInput" (keyup.enter)="onSendMessage()" placeholder="Ex: Generate a description for a 3-bedroom villa">
        <button mat-icon-button matSuffix (click)="onSendMessage()" [disabled]="!userInput.trim()">
          <mat-icon>send</mat-icon>
        </button>
      </mat-form-field>
    </div>
  </div>

  <div class="suggestions">
    <h3>Quick Actions</h3>
    <div class="suggestion-chips">
      <button mat-stroked-button (click)="userInput = 'Analyze my hot leads'; onSendMessage()">
        <mat-icon>analytics</mat-icon> Analyze Hot Leads
      </button>
      <button mat-stroked-button (click)="userInput = 'Generate description for Villa Oasis'; onSendMessage()">
        <mat-icon>description</mat-icon> Generate Description
      </button>
      <button mat-stroked-button (click)="userInput = 'Estimate price for 2BR in Downtown'; onSendMessage()">
        <mat-icon>calculate</mat-icon> Estimate Price
      </button>
    </div>
  </div>
</div>
