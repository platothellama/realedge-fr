<div class="page">
  <app-page-header [title]="'Sellers'" [subtitle]="filteredSellers.length + ' sellers'">
    <div class="header-actions">
      <button mat-raised-button color="primary" (click)="openSellerForm()">
        <mat-icon>person_add</mat-icon>
        Add Seller
      </button>
    </div>
  </app-page-header>

  <app-property-search
    [filters]="searchFilters"
    [config]="searchConfig"
    (filtersChange)="onFiltersChange($event)"
  ></app-property-search>

  @if (isLoading) {
    <app-loading-state />
  } @else if (filteredSellers.length === 0) {
    <app-empty-state icon="people" title="No sellers found" hint="Add a new seller to get started" />
  } @else {
    <div class="table-container">
      <table mat-table [dataSource]="filteredSellers" class="sellers-table">
        
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let seller">
            <div class="seller-name">{{ seller.name }}</div>
          </td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let seller">
            @if (seller.email) {
              <a [href]="'mailto:' + seller.email" (click)="$event.stopPropagation()">{{ seller.email }}</a>
            } @else {
              -
            }
          </td>
        </ng-container>

        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Phone</th>
          <td mat-cell *matCellDef="let seller">
            @if (seller.phone) {
              <a [href]="'tel:' + seller.phone" (click)="$event.stopPropagation()">{{ seller.phone }}</a>
            } @else {
              -
            }
          </td>
        </ng-container>

        <ng-container matColumnDef="city">
          <th mat-header-cell *matHeaderCellDef>City</th>
          <td mat-cell *matCellDef="let seller">{{ seller.city || '-' }}</td>
        </ng-container>

        <ng-container matColumnDef="propertiesCount">
          <th mat-header-cell *matHeaderCellDef>Properties</th>
          <td mat-cell *matCellDef="let seller">
            <span class="properties-count">{{ getPropertiesCount(seller) }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let seller">
            <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()" [attr.aria-label]="'Actions for ' + seller.name">
              <mat-icon aria-hidden="true">more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="openSellerDetails(seller)">
                <mat-icon>visibility</mat-icon>
                <span>View Details</span>
              </button>
              <button mat-menu-item (click)="openSellerForm(seller)">
                <mat-icon>edit</mat-icon>
                <span>Edit</span>
              </button>
              <button mat-menu-item (click)="deleteSeller(seller)" [disabled]="isDeleting(seller.id)">
                <mat-icon>delete</mat-icon>
                <span>Delete</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="openSellerDetails(row)" class="clickable-row"></tr>
      </table>
    </div>
  }
</div>
